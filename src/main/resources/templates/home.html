<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Google OAuth2 Demo</title>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .user-info {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            background-color: #4285F4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-danger {
            background-color: #db4437;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Google OAuth2 Demo</h1>

    <div th:if="${name}">
        <div class="user-info">
            <h2>Welcome, <span th:text="${name}">User</span>!</h2>
            <p>Email: <span th:text="${email}">email@example.com</span></p>
        </div>
        <p>
            <a class="btn btn-danger" href="/logout">Logout</a>
        </p>
    </div>

    <div th:unless="${name}">
        <p>You are not logged in.</p>
        <p>
            <a class="btn" href="/login">Login with Google</a>
        </p>
    </div>
</div>
</body>
</html>
